[package]
name = "sombra"
version = "0.2.0"
edition = "2021"
description = "Resilient multi-transport messaging research prototype for degraded and off-grid networks"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
